<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <header class="head">
      <h1 id="title">Welcome back</h1>
      <p class="sub" id="subtitle">Sign in to continue.</p>
    </header>

    <form id="form" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" placeholder="Your name">
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password">
          <input type="password" id="password" autocomplete="current-password" placeholder="At least 8 characters">
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <small class="error"></small>
      </div>

      <button type="submit" class="submit" id="submit">Sign in</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <p class="switch">
      <span id="switchText">No account yet?</span>
      <button type="button" class="link" id="switchBtn">Create one</button>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
